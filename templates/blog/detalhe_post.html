{% extends 'base.html' %}
{% block title %}{{ post.titulo }} | Hügel Männer Plattler{% endblock %}
{% block content %}
<div style="max-width: 800px; margin: 60px auto; padding: 0 5%;">
    <h1 style="font-weight: 300; margin-bottom: 10px;">{{ post.titulo }}</h1>
    <p style="color: #666; font-size: 0.9rem; margin-bottom: 30px;">Publicado em {{ post.data_publicacao|date:"d/m/Y" }}</p>
    <img src="{{ post.imagem.url }}" alt="{{ post.texto_descritivo_imagem }}" style="width: 100%; height: auto; margin-bottom: 30px;">
    <div style="font-weight: 300; font-size: 1.1rem; line-height: 1.8; text-align: justify;">
        {{ post.conteudo|linebreaks }}
    </div>
</div>
{% endblock %}
